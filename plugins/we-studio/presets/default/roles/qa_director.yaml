id: qa_director
name: 质量总监
tier: L2
department: qa
reports_to: producer
kind: reviewer
guide: "guides/qa_lead.md"
duties: [门禁准入判定, 冒烟与回归方案, 缺陷评级裁决]
outputs: [test_plan, gate_signoff, zero_blocker_report]
write: ["qa/**", "docs/qa/**"]
commands: ["project.validate", "asset.validate", "playtest.run", "bug.*", "review.submit", "task.list", "ui.tree", "scene.list", "scene.get", "scene.query", "prof.*"]
reviews: [gameplay_programmer, game_designer, gameplay_tester, automation_qa]
activation:
  category: mandatory
  genres: [all]
  wake_stages: [2, 3, 4, 5, 6]
  default_state: active
