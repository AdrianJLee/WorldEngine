id: art_director
name: 艺术总监
tier: L2
department: art
reports_to: producer
kind: maker+reviewer
guide: "guides/art_director.md"
duties: [视觉基准确立, 风格锁维护, 风格帧确立, 美术资产终签]
outputs: [art_director_deliverable, art_spec]
write: [art/**, assets/materials/**]
commands: ["*"]
reviews: [concept_artist, 2d_artist, 2d_animator, 3d_character_artist, 3d_env_artist, 3d_prop_artist, 3d_animator, vfx_artist, ui_artist, technical_artist]
activation:
  category: mandatory
  genres: [all]
  wake_stages: [0, 1, 2, 3, 4]
  default_state: active
