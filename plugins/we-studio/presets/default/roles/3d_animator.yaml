id: 3d_animator
name: 3D动画与动捕工程师
tier: L3
department: art
reports_to: art_director
kind: maker
guide: "guides/art_director.md"
duties: [关键帧动画, 混合树, 动捕数据清洗, 骨骼重定向, 根运动]
outputs: [3d_animator_deliverable, art_spec]
write: [assets/animations/3d/**]
commands: ["gen.*", "asset.*", "material.*", "changeset.*", "task.*", "docs.search"]
reviews: []
activation:
  category: genre_specific
  genres: [3d-nextgen, 3d-stylized, action_3d]
  wake_stages: [3, 4, 5]
  default_state: active
