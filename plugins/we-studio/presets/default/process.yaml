version: 1.0.0
preset: default
name: Standard Industrial Balanced Package
stages:
  - index: 0
    id: concept
    name: 概念与立项
    lead: producer
    participants: [creative_director, art_director, experience_director]
    outputs: [brief, gdd_high_level, vision_pitch]
    gate:
      required_outputs: [brief]
      reviewers: [producer]

  - index: 1
    id: feasibility
    name: 可行性论证与风格锁
    lead: creative_director
    participants: [art_director, tech_director, concept_artist_2d]
    outputs: [tech_spike, art_style_lock, budget_plan]
    gate:
      required_outputs: [art_style_lock]
      reviewers: [art_director, tech_director]

  - index: 2
    id: prototype
    name: 核心玩法找乐原型
    lead: game_designer
    participants: [gameplay_programmer, level_designer, sound_designer, gameplay_tester]
    outputs: [playable_prototype, greybox_level, test_asserts]
    gate:
      required_outputs: [playable_prototype]
      self_validations: [project.validate, playtest.run]
      reviewers: [creative_director, qa_director]

  - index: 3
    id: vertical_slice
    name: 垂直切片 (完整品质样板)
    lead: producer
    participants: [all]
    outputs: [vertical_slice_build, art_benchmark, performance_profile]
    gate:
      required_outputs: [vertical_slice_build]
      self_validations: [project.validate, asset.validate, playtest.run]
      reviewers: [producer, creative_director, art_director, tech_director, qa_director]

  - index: 4
    id: production
    name: 资产与内容量产
    lead: producer
    participants: [all]
    outputs: [all_levels, full_assets, feature_complete]
    gate:
      required_outputs: [all_levels]
      self_validations: [project.validate, asset.validate, build.package]
      reviewers: [producer, qa_director]

  - index: 5
    id: beta
    name: 优化、Bug修复与体验打磨
    lead: qa_director
    participants: [gameplay_tester, performance_tester, gameplay_programmer, ui_ux_designer]
    outputs: [zero_blocker_report, performance_signoff, polish_checklist]
    gate:
      required_outputs: [zero_blocker_report]
      self_validations: [playtest.run, project.validate]
      reviewers: [qa_director, tech_director]

  - index: 6
    id: launch
    name: 发行与打包上架
    lead: publishing_director
    participants: [producer, localization_lead, build_engineer]
    outputs: [shipping_package, release_notes, store_assets]
    gate:
      required_outputs: [shipping_package]
      self_validations: [build.package]
      reviewers: [producer, publishing_director]

  - index: 7
    id: liveops
    name: 持续运营与更新
    lead: producer
    participants: [community_manager, gameplay_programmer, gameplay_tester]
    outputs: [patch_plan, telemetry_report]
    gate:
      required_outputs: []
      reviewers: [producer]
