version: 1.0.0
preset: 2d-standard
name: 2D 精品包 (像素/手绘/横版动作)
stages:
  - index: 0
    id: concept
    name: 2D概念立项
    lead: producer
    outputs: [brief, pixel_moodboard]
    gate:
      required_outputs: [brief]
      reviewers: [producer]
  - index: 1
    id: prototype
    name: 精确手感与白盒找乐
    lead: game_designer
    outputs: [playable_2d_prototype]
    gate:
      required_outputs: [playable_2d_prototype]
      self_validations: [project.validate, playtest.run]
      reviewers: [game_designer, qa_lead]
  - index: 2
    id: production
    name: 瓦片关卡与图集量产
    lead: producer
    outputs: [full_tilemap_levels]
    gate:
      required_outputs: [full_tilemap_levels]
      self_validations: [project.validate, asset.validate]
      reviewers: [art_director, qa_lead]
  - index: 3
    id: launch
    name: 发行打包
    lead: producer
    outputs: [shipping_package]
    gate:
      required_outputs: [shipping_package]
      self_validations: [build.package]
      reviewers: [producer]
