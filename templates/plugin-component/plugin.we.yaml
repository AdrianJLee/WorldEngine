# Component Plugin — 插件清单模板(位置即 scope:本目录在 <plugins>/ 下 ⇒ scope = {{PluginScope}})。
# 字段口径:Engine/src/World/Plugins/PluginManifest.h 与 docs/dev/plugin-framework.md。
id: {{PluginId}}
name: {{PluginName}}
version: 1.0.0
abi: 1
entry: WePluginQuery
engine: ">=2.0"
# 场景组件(T2b 起为真实注册、T2c 起能挂到场景实体上,见 src/plugin.cpp):
provides:
  - scene.component
# 打包期引用索引(T5):本插件提供的组件类型 id(.wd 里以类型全名出现)。
contributes:
  components: [{{PluginId}}.Health]
ship: auto
