# Asset Type Plugin — 插件清单模板(位置即 scope:本目录在 <plugins>/ 下 ⇒ scope = {{PluginScope}})。
# 字段口径:Engine/src/World/Plugins/PluginManifest.h 与 docs/dev/plugin-framework.md。
id: {{PluginId}}
name: {{PluginName}}
version: 1.0.0
abi: 1
entry: WePluginQuery
engine: ">=2.0"
# 本模板注册新资产类型 + 导入器:
provides:
  - asset.type
  - asset.importer
# 打包期引用索引(T5):资产类型 + 导入器(内容里以文件扩展名出现)。
contributes:
  asset_types:
    - id: {{PluginDir}}
      extensions: [.{{PluginDir}}]
  importers:
    - id: {{PluginDir}}.asset
      extensions: [.{{PluginDir}}]
ship: auto
