# Lua Library Plugin — 插件清单模板(位置即 scope:本目录在 <plugins>/ 下 ⇒ scope = {{PluginScope}})。
# 字段口径:Engine/src/World/Plugins/PluginManifest.h 与 docs/dev/plugin-framework.md。
id: {{PluginId}}
name: {{PluginName}}
version: 1.0.0
abi: 1
entry: WePluginQuery
engine: ">=2.0"
# 脚本库(真实注册:WeHostApi::RegisterScriptFunction;命名空间 = 插件 id 的最后一段):
provides:
  - script.library
# 打包期引用索引(T5):脚本函数命名空间(.luau 里以 `<命名空间>.函数` 调用)。
# 命名空间由运行时按 **插件 id 的最后一段** 推导(src/plugin.cpp 的 LuaNamespace);
# 保持 id 最后一段与插件目录名一致(向导默认如此),改 id 时同步改这一行。
contributes:
  script_namespaces: [{{PluginDir}}]
ship: auto
