id: com.example.game
version: 1.0.0
content_root: assets
start_scene: scenes/3DTest.wd
renderer: vulkan
# 3D 渲染设置(引擎用户可直接改;编辑器 Window ▸ Project Settings 面板等价)。
#  - culling:视锥剔除(主通道按相机、阴影通道按光源);关掉 = 更慢但便于排查"物体消失"。
#  - shadows:方向光阴影通道。
#  - shadow_map_size:阴影贴图边长(2 的幂,256..4096;**下次启动生效**)。
#  - max_directional_lights / max_point_lights:每帧灯光上限(合计 ≤ 8)。
rendering:
  culling: true
  shadows: true
  shadow_map_size: 2048
  max_directional_lights: 1
  max_point_lights: 7
packages:
  - packages/Base.wpak
